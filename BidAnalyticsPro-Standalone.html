builders.pivot=function(){
  const sec=document.getElementById('pivot');sec.innerHTML='';
  const DIMS=['Bid Sheet','Buyer','Unit','Status','Lot No.'];
  const VALS=['Mat. Value','Quantity','Rate'];
  let rowFlds=['Buyer'],colFlds=['Bid Sheet'],valFld='Mat. Value',aggFn='sum';

  const controls=el('div','');

  // Top bar
  const topBar=el('div','filter-row');
  topBar.innerHTML=`<span class="fl">Value</span>
    <select id="pv-val">${VALS.map(v=>`<option${v===valFld?' selected':''}>${v}</option>`).join('')}</select>
    <span class="fl" style="margin-left:8px">Aggregation</span>
    <select id="pv-agg">
      <option value="sum">Sum</option><option value="avg">Average</option>
      <option value="count">Count</option><option value="max">Maximum</option><option value="min">Minimum</option>
    </select>`;
  controls.appendChild(topBar);
  topBar.querySelector('#pv-val').addEventListener('change',e=>{valFld=e.target.value;render();});
  topBar.querySelector('#pv-agg').addEventListener('change',e=>{aggFn=e.target.value;render();});

  // Zones
  const zoneRow=el('div','pivot-layout');

  const zRow=el('div','pzone glass');
  zRow.innerHTML='<div class="pzone-label">↕ Row Fields</div><div id="pv-row-chips"></div>';
  zoneRow.appendChild(zRow);

  const zCol=el('div','pzone glass');
  zCol.innerHTML='<div class="pzone-label">↔ Column Fields</div><div id="pv-col-chips"></div>';
  zoneRow.appendChild(zCol);

  const zFlds=el('div','pzone glass');
  zFlds.innerHTML='<div class="pzone-label">⊞ Available Fields</div><div id="pv-fields"></div>';
  zoneRow.appendChild(zFlds);
  controls.appendChild(zoneRow);
  sec.appendChild(controls);

  const pvOut=el('div','');sec.appendChild(pvOut);

  function renderZones(){
    const used=new Set([...rowFlds,...colFlds]);
    // row chips
    const rc=document.getElementById('pv-row-chips');
    rc.innerHTML='';
    rowFlds.forEach(f=>{
      const c=el('div','pchip',`${f} <span class="rm" data-f="${f}" data-z="row">✕</span>`);
      rc.appendChild(c);
    });
    if(!rowFlds.length)rc.innerHTML='<span style="font-size:10px;color:#475569">Click ↕ on fields →</span>';
    // col chips
    const cc=document.getElementById('pv-col-chips');
    cc.innerHTML='';
    colFlds.forEach(f=>{
      const c=el('div','pchip',`${f} <span class="rm" data-f="${f}" data-z="col">✕</span>`);
      cc.appendChild(c);
    });
    if(!colFlds.length)cc.innerHTML='<span style="font-size:10px;color:#475569">Click ↔ on fields →</span>';
    // available fields
    const af=document.getElementById('pv-fields');
    af.innerHTML='';
    DIMS.forEach(f=>{
      const p=el('div',`fpill${used.has(f)?' used':''}`,`${f}${!used.has(f)?` <span class="fpill-btn" data-f="${f}" data-z="row" title="Add to Rows">↕</span> <span class="fpill-btn" data-f="${f}" data-z="col" title="Add to Cols">↔</span>`:''}`);
      af.appendChild(p);
    });
    // bind remove
    document.querySelectorAll('.rm').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const f=btn.dataset.f,z=btn.dataset.z;
        if(z==='row')rowFlds=rowFlds.filter(x=>x!==f);
        else colFlds=colFlds.filter(x=>x!==f);
        renderZones();render();
      });
    });
    // bind add
    document.querySelectorAll('.fpill-btn').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const f=btn.dataset.f,z=btn.dataset.z;
        if(z==='row'&&!rowFlds.includes(f))rowFlds.push(f);
        if(z==='col'&&!colFlds.includes(f))colFlds.push(f);
        renderZones();render();
      });
    });
  }

  function agg(vals){
    if(!vals.length)return 0;
    if(aggFn==='sum')return vals.reduce((a,b)=>a+b,0);
    if(aggFn==='avg')return vals.reduce((a,b)=>a+b,0)/vals.length;
    if(aggFn==='count')return vals.length;
    if(aggFn==='max')return Math.max(...vals);
    if(aggFn==='min')return Math.min(...vals);
    return 0;
  }

  function render(){
    pvOut.innerHTML='';
    if(!rowFlds.length){pvOut.innerHTML='<div class="empty glass" style="border-radius:14px;margin-top:14px">Add at least one Row field to build the pivot table.</div>';return;}
    const rowVals=[...new Set(RAW.map(r=>rowFlds.map(f=>r[f]).join(' | ')))].sort();
    const colVals=colFlds.length?[...new Set(RAW.map(r=>colFlds.map(f=>r[f]).join(' | ')))].sort():['Value'];
    const cells={};
    RAW.forEach(row=>{
      const rk=rowFlds.map(f=>row[f]).join(' | ');
      const ck=colFlds.length?colFlds.map(f=>row[f]).join(' | '):'Value';
      if(!cells[rk])cells[rk]={};
      if(!cells[rk][ck])cells[rk][ck]=[];
      cells[rk][ck].push(row[valFld]||0);
    });

    const wrap=el('div','pvtbl-wrap');
    const tbl=el('table','pvtbl');
    // Head
    const thead=el('thead','');
    const hr=el('tr','');
    hr.appendChild(el('th','',(rowFlds.join(' / '))));
    colVals.forEach(c=>hr.appendChild(Object.assign(el('th','',c))));
    hr.appendChild(Object.assign(el('th','','Total'),{style:'color:#00f5ff'}));
    thead.appendChild(hr);tbl.appendChild(thead);
    // Body
    const tbody=el('tbody','');
    const grandTotals={};colVals.forEach(c=>grandTotals[c]=0);let grandTotal=0;
    rowVals.forEach(rk=>{
      const tr=el('tr','');
      tr.appendChild(el('td','',rk));
      let rowTotal=0;
      colVals.forEach(c=>{
        const v=agg(cells[rk]?.[c]||[]);
        rowTotal+=v;
        grandTotals[c]=(grandTotals[c]||0)+v;
        tr.appendChild(Object.assign(el('td','pvnum',aggFn==='count'?v.toFixed(0):fmt(v))));
      });
      grandTotal+=rowTotal;
      tr.appendChild(Object.assign(el('td','pvnum',fmt(rowTotal)),{style:'color:#00f5ff;font-weight:700'}));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    // Grand total row
    const tfoot=el('tfoot','');
    const gtr=el('tr','pvtot','');
    gtr.appendChild(el('td','','Grand Total'));
    colVals.forEach(c=>gtr.appendChild(el('td','',fmt(grandTotals[c]||0))));
    gtr.appendChild(el('td','',fmt(grandTotal)));
    tfoot.appendChild(gtr);tbl.appendChild(tfoot);
    wrap.appendChild(tbl);
    pvOut.appendChild(wrap);
  }

  renderZones();render();
};

builders.charts=function(){
  const sec=document.getElementById('charts');sec.innerHTML='';

  // Build data
  const auctMap={};RAW.forEach(r=>{const k=String(r['Bid Sheet']);if(!auctMap[k])auctMap[k]={name:k,v:0};auctMap[k].v+=r['Mat. Value'];});
  const byAuct=Object.values(auctMap).sort((a,b)=>a.name-b.name);

  const buyMap={};RAW.forEach(r=>{const k=r.Buyer.split(' ').slice(0,2).join(' ');if(!buyMap[k])buyMap[k]={name:k,v:0};buyMap[k].v+=r['Mat. Value'];});
  const byBuy=Object.values(buyMap).sort((a,b)=>b.v-a.v);

  const unitMap={};RAW.forEach(r=>{if(!unitMap[r.Unit])unitMap[r.Unit]={name:r.Unit,v:0};unitMap[r.Unit].v+=r['Mat. Value'];});
  const byUnit=Object.values(unitMap);

  let settled=0,partPaid=0,pending=0;
  WORK.forEach(r=>{if(r['FP Received']>0)settled++;else if(r['SD Received']>0)partPaid++;else pending++;});

  const grid=el('div','chart-grid');
  const charts=[
    {id:'ch1',title:'Mat. Value by Auction',type:'bar',labels:byAuct.map(a=>a.name),data:byAuct.map(a=>a.v)},
    {id:'ch2',title:'Payment Status',type:'doughnut',labels:['Fully Settled','SD Only','Pending'],data:[settled,partPaid,pending]},
    {id:'ch3',title:'Top Buyers (Mat. Value)',type:'bar',labels:byBuy.slice(0,8).map(b=>b.name),data:byBuy.slice(0,8).map(b=>b.v),horizontal:true},
    {id:'ch4',title:'Unit Type Value Share',type:'pie',labels:byUnit.map(u=>u.name),data:byUnit.map(u=>u.v)},
    {id:'ch5',title:'Top 15 Lots — Mat. Value',type:'bar',labels:RAW.slice().sort((a,b)=>b['Mat. Value']-a['Mat. Value']).slice(0,15).map(r=>r['Lot No.']),data:RAW.slice().sort((a,b)=>b['Mat. Value']-a['Mat. Value']).slice(0,15).map(r=>r['Mat. Value']),span:true},
  ];

  charts.forEach(c=>{
    const cell=el('div','ccell glass-strong');
    if(c.span)cell.style.gridColumn='1 / -1';
    cell.innerHTML=`<div class="ctitle">${c.title}</div><canvas id="${c.id}"></canvas>`;
    grid.appendChild(cell);
  });
  sec.appendChild(grid);

  const ttOpts={callbacks:{label:ctx=>'₹'+ctx.raw.toLocaleString('en-IN')}};
  const gridColor='rgba(255,255,255,0.04)';

  setTimeout(()=>{
    charts.forEach((c,i)=>{
      const cfg={type:c.type,data:{labels:c.labels,datasets:[{data:c.data,backgroundColor:COLORS.slice(0,c.data.length),borderRadius:c.type==='bar'?5:0,borderColor:'#070711',borderWidth:c.type==='bar'?0:2}]},options:{responsive:true,plugins:{legend:{display:c.type!=='bar',labels:{color:'#94a3b8',font:{size:10}}},tooltip:ttOpts}}};
      if(c.type==='bar'){
        cfg.options.scales={
          x:{ticks:{color:'#64748b',font:{size:9}},grid:{color:gridColor},indexAxis:c.horizontal?'y':undefined},
          y:{ticks:{color:'#64748b',font:{size:9},callback:v=>'₹'+(v/1e6).toFixed(1)+'M'},grid:{color:gridColor}}
        };
        if(c.horizontal){
          cfg.options.indexAxis='y';
          cfg.options.scales.y.ticks.callback=undefined;
          cfg.options.scales.x.ticks.callback=v=>'₹'+(v/1e6).toFixed(1)+'M';
        }
      }
      new Chart(document.getElementById(c.id),cfg);
    });
  },50);
};

builders.variants=function(){
  const sec=document.getElementById('variants');sec.innerHTML='';
  const defaultVariants=[
    {id:1,name:'All Lots — Default',desc:'Full view, no filters',filters:{},sortKey:'Lot No.',sortDir:'asc'},
    {id:2,name:'High Value Descending',desc:'Sorted by Mat. Value ↓',filters:{},sortKey:'Mat. Value',sortDir:'desc'},
    {id:3,name:'Auction 21977 Only',desc:'Filter: Bid Sheet = 21977',filters:{'Bid Sheet':21977},sortKey:'Lot No.',sortDir:'asc'},
    {id:4,name:'Auction 21978 Only',desc:'Filter: Bid Sheet = 21978',filters:{'Bid Sheet':21978},sortKey:'Lot No.',sortDir:'asc'},
    {id:5,name:'KG Unit Scrap',desc:'Filter: Unit = KG, by value',filters:{Unit:'KG'},sortKey:'Mat. Value',sortDir:'desc'},
    {id:6,name:'NO Unit Items',desc:'Filter: Unit = NO',filters:{Unit:'NO'},sortKey:'Rate',sortDir:'desc'},
  ];
  let variants=[...defaultVariants];
  let activeId=1;
  let sortKey='Lot No.',sortDir='asc';

  const layout=el('div','var-layout');
  const left=el('div','');const right=el('div','');
  layout.appendChild(left);layout.appendChild(right);
  sec.appendChild(layout);

  let previewWrap=null;

  function renderLeft(){
    left.innerHTML='<div class="lbl">Saved Variants</div>';
    const vlist=el('div','vlist');
    variants.forEach(v=>{
      const item=el('div',`vitem${v.id===activeId?' va':''}`,
        `<div style="flex:1"><div class="vname">${v.name}</div><div class="vmeta">${v.desc}</div></div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn btn-sm btn-ghost" data-id="${v.id}" data-dir="-1">▲</button>
          <button class="btn btn-sm btn-ghost" data-id="${v.id}" data-dir="1">▼</button>
          ${variants.length>1?`<button class="btn btn-sm btn-danger" data-del="${v.id}">✕</button>`:''}
        </div>`
      );
      item.addEventListener('click',e=>{
        if(e.target.dataset.dir){
          const idx=variants.findIndex(x=>x.id===v.id);
          const dir=parseInt(e.target.dataset.dir);
          if(idx+dir>=0&&idx+dir<variants.length){[variants[idx],variants[idx+dir]]=[variants[idx+dir],variants[idx]];}
          renderLeft();return;
        }
        if(e.target.dataset.del){
          variants=variants.filter(x=>x.id!==parseInt(e.target.dataset.del));
          if(activeId===v.id)activeId=variants[0].id;
          renderLeft();renderRight();return;
        }
        activeId=v.id;renderLeft();renderRight();
      });
      vlist.appendChild(item);
    });
    left.appendChild(vlist);

    // Create form
    const div2=el('div','');
    div2.innerHTML='<div class="divider"></div><div class="lbl">Create New Variant</div>';
    const nameInp=el('input','');nameInp.type='text';nameInp.placeholder='Variant name';nameInp.style.marginBottom='8px';
    const descInp=el('input','');descInp.type='text';descInp.placeholder='Description (optional)';descInp.style.marginBottom='8px';
    const saveBtn=el('button','btn btn-primary','＋ Save Variant');
    saveBtn.addEventListener('click',()=>{
      if(!nameInp.value.trim())return;
      variants.push({id:nextId++,name:nameInp.value.trim(),desc:descInp.value.trim(),filters:{},sortKey:'Lot No.',sortDir:'asc'});
      nameInp.value='';descInp.value='';renderLeft();showToast('Variant saved');
    });
    div2.appendChild(nameInp);div2.appendChild(descInp);div2.appendChild(saveBtn);
    left.appendChild(div2);
  }

  function renderRight(){
    right.innerHTML='';
    const v=variants.find(x=>x.id===activeId)||variants[0];
    let d=RAW.filter(r=>{
      return Object.entries(v.filters||{}).every(([k,val])=>r[k]===val);
    });
    const sk=v.sortKey;const sd=v.sortDir;
    d=[...d].sort((a,b)=>{
      const av=a[sk],bv=b[sk];
      const n=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'en',{numeric:true});
      return sd==='asc'?n:-n;
    });

    // Header
    const hdr=el('div','');
    hdr.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap';
    hdr.innerHTML=`<div><div style="font-size:14px;font-weight:700;color:#e2e8f0">${v.name}</div>
      <div style="font-size:10px;color:#64748b;margin-top:2px">${v.desc} — ${d.length} records</div></div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <span class="fl">Sort</span>
        <select id="vs-key">${['Lot No.','Buyer','Quantity','Rate','Mat. Value','Bid Sheet'].map(k=>`<option value="${k}"${k===sortKey?' selected':''}>${k}</option>`).join('')}</select>
        <select id="vs-dir"><option value="asc"${sortDir==='asc'?' selected':''}>▲ Asc</option><option value="desc"${sortDir==='desc'?' selected':''}>▼ Desc</option></select>
      </div>`;
    right.appendChild(hdr);
    right.querySelector('#vs-key').addEventListener('change',e=>{sortKey=e.target.value;renderRight();});
    right.querySelector('#vs-dir').addEventListener('change',e=>{sortDir=e.target.value;renderRight();});

    const cols=[
      {key:'Lot No.',label:'Lot No.'},
      {key:'Buyer',label:'Buyer'},
      {key:'Lot Name',label:'Lot Name'},
      {key:'Quantity',label:'Qty',num:true},
      {key:'Unit',label:'Unit'},
      {key:'Rate',label:'Rate',num:true},
      {key:'Mat. Value',label:'Mat. Value',num:true}
    ];

    // Re-sort with user override
    const manualSorted=[...d].sort((a,b)=>{
      const av=a[sortKey],bv=b[sortKey];
      const n=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'en',{numeric:true});
      return sortDir==='asc'?n:-n;
    });

    const tw=makeTable(cols,manualSorted,{totals:true});
    right.appendChild(tw);
  }

  renderLeft();renderRight();
};

<script id="ss-mobile">
/* Adds small-screen CSS to the embedded ScrapSale Pro document when its tab
   mounts. The frame is same-origin, so its head is reachable; the embedded
   file itself stays byte-identical to the original. */
(function(){
  var CSS = "\n@media (max-width: 820px) {\n  main { padding: 14px 12px 40px; }\n  #topbar { padding: 9px 12px; flex-wrap: wrap; }\n  #topbar h1 { font-size: 14px; }\n  .top-actions { width: 100%; margin-left: 0; gap: 6px; }\n  .top-actions .btn { flex: 1; justify-content: center; }\n  .panel { padding: 12px; border-radius: 12px; }\n  .panel h2 { font-size: 13px; }\n  .btn { padding: 9px 12px; }\n  .nav-btn { padding: 11px 12px; }\n  .controls { gap: 8px; }\n  .controls > div { flex: 1 1 45%; min-width: 0; }\n  .controls label { display: block; margin: 0 0 3px; }\n  .controls select, .controls input[type=text] { width: 100%; min-width: 0; }\n  .table-wrap { -webkit-overflow-scrolling: touch; }\n  /* row editor: 3 columns -> 1fr 1fr, amount grid: 4 columns -> 3 */\n  .form-grid { grid-template-columns: 1fr 1fr; }\n  .form-grid .span2 { grid-column: 1 / -1; }\n  .form-grid input, .form-grid select { font-size: 16px; padding: 9px 10px; }\n  .amt-grid { grid-template-columns: minmax(0, 1.5fr) 72px minmax(0, 1fr); }\n  .amt-grid > *:nth-child(4n) { display: none; }   /* drop the \"Calculated on\" column */\n  .amt-grid input { font-size: 16px; padding: 9px 8px; }\n  .amt-grid input[type=date] { width: 100%; }\n  .modal { max-width: 100%; border-radius: 14px; }\n  .modal.wide { max-width: 100%; }\n  .modal-body { padding: 14px; }\n  .col-picker-panel { width: min(320px, calc(100vw - 24px)); }\n  .col-menu { min-width: min(260px, calc(100vw - 24px)); }\n  .col-toggle { padding: 7px 12px; }\n  #dropzone { padding: 22px 14px; }\n  .workspace-row { padding: 12px 0; }\n  input[type=text], input[type=search], input[type=date], select { font-size: 16px; }\n  input[type=text], input[type=search] { min-width: 0; }\n}\n";
  function dress(frame){
    try{
      var d = frame.contentDocument;
      if(!d || !d.head || d.getElementById('ssMobileCss')) return;
      var s = d.createElement('style');
      s.id = 'ssMobileCss';
      s.textContent = CSS;
      d.head.appendChild(s);
    }catch(e){ /* opaque origin — nothing to do */ }
  }
  var mount = builders.scrapsale;
  builders.scrapsale = function(){
    mount();
    var frame = document.getElementById('ssFrame');
    if(!frame) return;
    frame.addEventListener('load', function(){ dress(frame); });
    if(frame.contentDocument && frame.contentDocument.readyState === 'complete') dress(frame);
  };
})();
</script>
