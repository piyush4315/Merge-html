<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BidAnalytics Pro — MSTC Limited</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#00f5ff;--violet:#7c3aed;--pink:#f72585;--green:#39ff14;--amber:#ffbe0b;
  --bg:#070711;--bg2:#0d0d24;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07);
  --text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--deep:#475569;
}
html{scroll-behavior:smooth}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0d0d1a}
::-webkit-scrollbar-thumb{background:var(--violet);border-radius:3px}

/* BG atmosphere */
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 15% 15%,rgba(0,245,255,0.05) 0%,transparent 50%),
             radial-gradient(ellipse at 85% 85%,rgba(124,58,237,0.07) 0%,transparent 50%),
             radial-gradient(ellipse at 50% 0%,rgba(247,37,133,0.03) 0%,transparent 40%);
  pointer-events:none;z-index:0}

/* ── HERO ── */
.hero{position:relative;z-index:1;padding:52px 32px 28px;text-align:center}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);margin-bottom:14px;opacity:.85}
.hero h1{font-size:clamp(34px,6vw,68px);font-weight:900;line-height:1.05;margin-bottom:14px;
  background:linear-gradient(135deg,#fff 0%,#c4b5fd 35%,var(--cyan) 65%,var(--violet) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:14px;color:var(--muted);max-width:540px;margin:0 auto 22px;line-height:1.75}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.badge{padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border:1px solid;display:inline-flex;align-items:center;gap:4px}
.bc{border-color:rgba(0,245,255,.35);background:rgba(0,245,255,.07);color:var(--cyan)}
.bv{border-color:rgba(124,58,237,.4);background:rgba(124,58,237,.08);color:#c4b5fd}
.bp{border-color:rgba(247,37,133,.4);background:rgba(247,37,133,.08);color:#f9a8d4}
.bg-b{border-color:rgba(57,255,20,.4);background:rgba(57,255,20,.07);color:#86efac}

/* ── KPI STRIP ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;padding:24px 32px;position:relative;z-index:1}
.kpi{padding:20px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;cursor:default}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0}
.kpi:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.kpi.c::before{background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.kpi.v::before{background:linear-gradient(90deg,transparent,var(--violet),transparent)}
.kpi.p::before{background:linear-gradient(90deg,transparent,var(--pink),transparent)}
.kpi.g::before{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.kpi.a::before{background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.55;margin-bottom:7px}
.kpi-val{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1.1}
.kpi-sub{font-size:10px;opacity:.42;margin-top:5px}
.c .kpi-val{color:var(--cyan);text-shadow:0 0 18px rgba(0,245,255,.45)}
.v .kpi-val{color:#c4b5fd;text-shadow:0 0 18px rgba(196,181,253,.4)}
.p .kpi-val{color:#f9a8d4;text-shadow:0 0 18px rgba(249,168,212,.4)}
.g .kpi-val{color:#86efac;text-shadow:0 0 18px rgba(134,239,172,.4)}
.a .kpi-val{color:#fcd34d;text-shadow:0 0 18px rgba(252,211,77,.4)}

/* ── NAV ── */
.nav{position:relative;z-index:1;display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06);padding:0 32px}
.nav-tab{padding:12px 18px;font-size:12px;font-weight:600;letter-spacing:.4px;border:none;background:transparent;cursor:pointer;
  color:var(--dim);border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:'Inter',sans-serif}
.nav-tab:hover{color:var(--muted);border-bottom-color:rgba(255,255,255,.1)}
.nav-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ── SECTION ── */
.section{display:none;padding:24px 32px;position:relative;z-index:1}
.section.active{display:block}

/* ── GLASS CARD ── */
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:14px}
.glass-strong{background:rgba(255,255,255,.04);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.09);border-radius:14px}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-box{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px 13px}
.search-box input{background:none;border:none;color:var(--text);font-size:12px;width:100%;outline:none;font-family:'Inter',sans-serif}
.search-box input::placeholder{color:var(--deep)}
.si{color:var(--deep);font-size:13px}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:8px;font-size:11px;font-weight:600;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;transition:all .2s;letter-spacing:.3px;white-space:nowrap;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,rgba(124,58,237,.5),rgba(0,245,255,.1));border:1px solid rgba(0,245,255,.3);color:var(--cyan)}
.btn-primary:hover{box-shadow:0 0 18px rgba(0,245,255,.18);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,.07);color:var(--text)}
.btn-danger{background:rgba(247,37,133,.1);border:1px solid rgba(247,37,133,.3);color:#f9a8d4}
.btn-danger:hover{background:rgba(247,37,133,.18)}
.btn-success{background:rgba(57,255,20,.1);border:1px solid rgba(57,255,20,.3);color:#86efac}
.btn-success:hover{background:rgba(57,255,20,.18)}
.btn-sm{padding:4px 9px;font-size:10px}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;pointer-events:none}

/* ── TABLE ── */
.tbl-wrap{overflow:auto;border-radius:13px;border:1px solid rgba(255,255,255,.06);max-height:480px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
thead th{background:rgba(0,0,0,.45);padding:11px 13px;text-align:left;font-size:9px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;top:0;z-index:5;white-space:nowrap;cursor:pointer;user-select:none;font-family:'Inter',sans-serif}
thead th:hover{color:var(--muted);background:rgba(0,245,255,.03)}
thead th.srt{color:var(--cyan)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.025);transition:background .12s}
tbody tr:hover{background:rgba(0,245,255,.025)}
tbody tr.sel{background:rgba(124,58,237,.08);border-left:2px solid var(--violet)}
tbody td{padding:10px 13px;color:#cbd5e1;vertical-align:middle;font-size:12px}
tbody td.num{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right}
.sort-arrow{margin-left:4px;opacity:.5;font-size:9px}
.srt .sort-arrow{opacity:1}
tfoot td{background:rgba(0,245,255,.03);padding:10px 13px;font-family:'JetBrains Mono',monospace;font-size:11px;
  font-weight:700;color:var(--cyan);border-top:1px solid rgba(0,245,255,.12);text-align:right}
tfoot td:first-child{text-align:left;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase}

/* cell badges */
.tag{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;display:inline-block}
.tag-sold{background:rgba(134,239,172,.12);color:#86efac;border:1px solid rgba(134,239,172,.3)}
.tag-pending{background:rgba(252,211,77,.12);color:#fcd34d;border:1px solid rgba(252,211,77,.3)}
.tag-excess{background:rgba(249,168,212,.12);color:#f9a8d4;border:1px solid rgba(249,168,212,.3)}
.tag-settled{background:rgba(134,239,172,.12);color:#86efac;border:1px solid rgba(134,239,172,.3)}

/* editable cell */
td.ed{cursor:text}
td.ed:hover{background:rgba(0,245,255,.04)}
input.cedit{background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.4);border-radius:4px;
  color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 6px;width:100%;outline:none}

/* ── COL MANAGER ── */
.col-mgr{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(0,0,0,.3);
  border-radius:10px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}
.col-tog{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:8px;cursor:pointer;
  font-size:10px;font-weight:600;border:1px solid;transition:all .2s;user-select:none;font-family:'Inter',sans-serif}
.col-on{background:rgba(0,245,255,.07);border-color:rgba(0,245,255,.25);color:var(--cyan)}
.col-off{background:transparent;border-color:rgba(255,255,255,.07);color:var(--deep)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-on{background:var(--cyan);box-shadow:0 0 7px rgba(0,245,255,.6)}
.dot-off{background:#334155}

/* ── FILTERS ── */
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.fl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
select{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:7px;
  color:var(--text);font-size:11px;padding:6px 11px;outline:none;cursor:pointer;font-family:'Inter',sans-serif}
select:focus{border-color:rgba(0,245,255,.4)}
option{background:#0d0d24}

/* ── PIVOT ── */
.pivot-layout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}
.pzone{background:rgba(0,0,0,.3);border:1px dashed rgba(255,255,255,.1);border-radius:11px;padding:13px;min-height:80px}
.pzone-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;
  background:rgba(0,245,255,.12);border:1px solid rgba(0,245,255,.35);color:var(--cyan);cursor:pointer;margin:3px 3px 3px 0;transition:all .2s}
.pchip .rm{opacity:.5;font-size:9px;margin-left:2px;cursor:pointer}
.pchip .rm:hover{opacity:1;color:var(--pink)}
.fpill{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--muted);
  margin:3px 3px 3px 0;display:inline-flex;align-items:center;gap:5px;transition:all .2s;font-family:'Inter',sans-serif}
.fpill:hover{background:rgba(0,245,255,.07);border-color:rgba(0,245,255,.3);color:var(--cyan)}
.fpill.used{opacity:.3;cursor:default;pointer-events:none}
.fpill-btn{font-size:9px;cursor:pointer;padding:0 3px;border-radius:3px;background:rgba(0,245,255,.1);color:var(--cyan)}
.fpill-btn:hover{background:rgba(0,245,255,.25)}
.pvtbl-wrap{overflow:auto;max-height:400px;border-radius:11px;border:1px solid rgba(255,255,255,.06)}
.pvtbl{border-collapse:collapse;font-size:11px;min-width:100%}
.pvtbl th{background:rgba(0,0,0,.5);padding:9px 13px;text-align:right;font-size:9px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;top:0;z-index:2;white-space:nowrap}
.pvtbl th:first-child{text-align:left}
.pvtbl td{padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.03);color:#cbd5e1;text-align:right}
.pvtbl td:first-child{text-align:left;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvtbl td.pvnum{font-family:'JetBrains Mono',monospace;color:#a5b4fc}
.pvtbl tr.pvtot td{background:rgba(0,245,255,.04);border-top:1px solid rgba(0,245,255,.12);font-weight:700;color:var(--cyan);font-family:'JetBrains Mono',monospace}
.pvtbl tr.pvtot td:first-child{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.pvtbl tr:hover td{background:rgba(0,245,255,.02)}

/* ── CHARTS ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ccell{padding:20px;border-radius:14px}
.ctitle{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
canvas{max-height:230px}

/* ── VARIANTS ── */
.var-layout{display:grid;grid-template-columns:270px 1fr;gap:18px}
.vlist{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.vitem{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .2s}
.vitem:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.vitem.va{background:rgba(124,58,237,.11);border-color:rgba(124,58,237,.3)}
.vname{flex:1;font-size:11px;font-weight:600;color:var(--text)}
.vmeta{font-size:9px;color:var(--dim);margin-top:2px}
.vbadge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(0,245,255,.1);color:var(--cyan);border:1px solid rgba(0,245,255,.25)}

/* ── DASHBOARD ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.perf-table table{min-width:unset}

/* ── MISC ── */
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);margin:18px 0}
.lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.empty{text-align:center;padding:40px;color:var(--deep);font-size:12px}
.row-bar{display:flex;gap:8px;align-items:center;padding:9px 13px;background:rgba(124,58,237,.07);
  border:1px solid rgba(124,58,237,.2);border-radius:9px;margin-bottom:11px;font-size:11px;color:#c4b5fd}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:7px}
.prog-fill{height:100%;border-radius:2px;transition:width .5s}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;right:22px;z-index:999;padding:11px 18px;border-radius:10px;font-size:12px;font-weight:600;
  background:rgba(0,245,255,.13);border:1px solid rgba(0,245,255,.35);color:var(--cyan);backdrop-filter:blur(20px);
  display:none;pointer-events:none}

/* ── INPUT ── */
input[type=text],input[type=number]{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:7px;
  color:var(--text);font-size:11px;padding:7px 11px;outline:none;font-family:'Inter',sans-serif;width:100%}
input[type=text]:focus,input[type=number]:focus{border-color:rgba(0,245,255,.4)}
input[type=checkbox]{accent-color:var(--violet);cursor:pointer;width:13px;height:13px}

@media(max-width:900px){
  .chart-grid,.pivot-layout,.var-layout,.dash-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .hero{padding:32px 16px 20px}.kpi-grid,.section{padding:16px}
  .nav{padding:0 16px}.hero h1{font-size:28px}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
/* SCRAPSALE-CSS-START */
/* ── SCRAPSALE PRO TAB (embedded workspace) ── */
.ss-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;
  background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.2);border-radius:11px}
.ss-title{font-size:12px;font-weight:700;color:#c4b5fd;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ss-title small{font-weight:500;color:var(--dim);font-size:10px;letter-spacing:.2px}
.ss-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ss-frame-wrap{position:relative;border-radius:14px;overflow:hidden;background:#f4f6fb;
  border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.ss-frame-wrap:fullscreen{border:0;border-radius:0}
#ssFrame{display:block;width:100%;border:0;background:#f4f6fb;height:calc(100vh - 250px);min-height:640px}
.ss-frame-wrap:fullscreen #ssFrame{height:100vh;min-height:0}
.ss-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
  background:#f4f6fb;color:#475569;font-size:12px;font-weight:600}
.ss-spin{width:15px;height:15px;border-radius:50%;border:2px solid #c7d2fe;border-top-color:#2563eb;
  animation:ssspin .8s linear infinite}
@keyframes ssspin{to{transform:rotate(360deg)}}
@media(max-width:900px){#ssFrame{height:calc(100vh - 180px);min-height:560px}}
/* SCRAPSALE-CSS-END */</style>
</head>

:root {
  --accent: #002FA7; --accent-2: #2563eb;
  --bg: #f4f6fb; --panel: #fff; --line: #e3e8f0;
  --ink: #0f172a; --muted: #64748b;
  --green: #15803d; --red: #b91c1c; --amber: #b45309;
  --side: #0b1220;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 13px;
}
#layout { display: flex; min-height: 100vh; }
/* ---------- sidebar ---------- */
aside {
  width: 230px; background: var(--side); color: #cbd5e1;
  position: sticky; top: 0; height: 100vh; flex-shrink: 0;
  display: flex; flex-direction: column;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-logo {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, #2563eb, #002FA7);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px;
}
.brand-name { font-weight: 700; color: #fff; font-size: 14px; }
.brand-name span { color: #60a5fa; }
.brand-sub { font-size: 10.5px; color: #64748b; margin-top: 2px; }
nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px;
  border: 0; background: transparent; color: #94a3b8; font-size: 12.5px; font-weight: 600;
  border-radius: 9px; cursor: pointer; text-align: left; font-family: inherit;
}
.nav-btn:hover { background: rgba(255,255,255,.06); color: #e2e8f0; }
.nav-btn.active { background: rgba(37,99,235,.2); color: #fff; }
.nav-btn .nbadge { margin-left: auto; background: rgba(255,255,255,.12); border-radius: 99px; font-size: 10.5px; padding: 1px 7px; }
.nav-btn svg { flex-shrink: 0; }
.side-foot { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #64748b; display: flex; flex-direction: column; gap: 5px; }
.side-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
.side-foot .dot.off { background: #f59e0b; }
/* ---------- topbar ---------- */
#mainwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.93); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 10px 22px;
  display: flex; align-items: center; gap: 12px;
}
#topbar h1 { font-size: 15px; margin: 0; }
#topbar p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 9px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: #f1f5f9; }
.btn.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.primary:hover { background: #1d4ed8; }
.btn.danger { color: var(--red); border-color: #fecaca; }
.btn.danger:hover { background: #fef2f2; }
.btn:disabled { opacity: .45; cursor: default; }
.count-pill { font-size: 10px; background: rgba(100,116,139,.16); border-radius: 99px; padding: 1px 6px; font-weight: 700; }
.caret { font-size: 9px; color: inherit; opacity: .7; }
.dropdown { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); background: #fff;
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,.16);
  min-width: 262px; padding: 6px; display: none; z-index: 50;
}
.menu.open { display: block; }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
  border: 0; background: transparent; border-radius: 8px; cursor: pointer;
  font-size: 12px; text-align: left; font-family: inherit; color: var(--ink);
}
.menu-item:hover { background: #f1f5f9; }
.menu-item small { display: block; color: var(--muted); font-size: 10.5px; margin-top: 1px; }
/* ---------- main ---------- */
main { padding: 20px 22px 48px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 13px 14px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
.card-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card.warn .card-value { color: var(--amber); }
.card.good .card-value { color: var(--green); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
.panel h2 { font-size: 13.5px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls label { font-size: 11px; color: var(--muted); margin-right: 5px; font-weight: 600; }
select, input[type=text], input[type=search], input[type=number], input[type=date] {
  font-family: inherit; font-size: 12px; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
}
input[type=text], input[type=search] { min-width: 190px; }
input:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(37,99,235,.14); }
.spacer { flex: 1; }
/* ---------- tables ---------- */
.table-wrap {
  /* Keep horizontal scrolling for the wide Excel-style grid, but let the page
     carry vertical scrolling instead of showing a second vertical scrollbar. */
  overflow-x: auto; overflow-y: hidden; border: 1px solid var(--line); border-radius: 11px;
  max-height: none;
}
table { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.lots-table { border-collapse: separate; border-spacing: 0; }
thead th {
  position: sticky; top: 0; z-index: 2; background: #f8fafc;
  text-align: right; padding: 9px 11px; font-weight: 700; color: #475569; font-size: 11px;
  border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
}
thead th.left { text-align: left; }
thead th.nosort { cursor: default; }
thead th:hover { background: #eef2f7; }
thead th .arrow { font-size: 9px; margin-left: 3px; color: var(--muted); }
.th-freeze {
  border: 0; background: transparent; color: #94a3b8; cursor: pointer;
  font-size: 11px; padding: 0 3px; border-radius: 4px; line-height: 1; margin-left: 2px;
}
.th-freeze:hover { background: #e2e8f0; color: var(--ink); }
.th-freeze.on { color: var(--accent-2); background: #dbeafe; }
th.frozen, td.frozen {
  position: sticky; z-index: 3; background: #fff;
  box-shadow: inset -1px 0 0 var(--line);
}
thead th.frozen { z-index: 6; background: #f8fafc; top: 0; }
tfoot td.frozen { z-index: 4; background: #f8fafc; }
th.frozen-last, td.frozen-last { box-shadow: 3px 0 6px rgba(15,23,42,.14); }
tbody tr:hover td.frozen { background: #f8fafc; }
tbody tr.selected td.frozen, tbody tr.drill-target td.frozen { background: #e8f1fe; }
td.edit.frozen { background: #f5f9ff; }
td.rng, th.rng { background: #cfe2ff !important; }
td.rng-anchor { outline: 2px solid #002FA7; outline-offset: -2px; }
#gridSelInfo {
  position: fixed; left: 18px; bottom: 16px; z-index: 80;
  background: #0f172a; color: #f8fafc; font-size: 11.5px; font-weight: 600;
  padding: 6px 10px; border-radius: 8px; display: none;
  box-shadow: 0 6px 18px rgba(15,23,42,.25);
}
tbody td { padding: 7px 11px; border-bottom: 1px solid #eef2f7; text-align: right; }
tbody tr:hover { background: #f8fafc; }
tbody tr.selected { background: #e8f1fe; }
td.left { text-align: left; font-weight: 600; }
td.strong { font-weight: 700; }
td.pos { color: var(--red); font-weight: 600; }
td.neg { color: var(--green); font-weight: 600; }
td.zero { color: var(--muted); }
td.date { text-align: center; color: var(--muted); font-size: 11px; }
tfoot td {
  font-weight: 700; border-top: 2px solid var(--line); background: #f8fafc;
  position: sticky; bottom: 0; padding: 9px 11px; text-align: right; z-index: 2;
}
tfoot td.left { text-align: left; }
.hint { font-size: 11px; color: var(--muted); margin: 9px 2px 0; line-height: 1.5; }
.badge-edit {
  display: inline-block; font-size: 10px; font-weight: 700; color: var(--accent-2);
  background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 99px; padding: 2px 8px;
}
/* editable cells */
td.edit { background: #f5f9ff; }
td.edit input {
  width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 3px 6px; font: inherit; text-align: right; color: inherit;
}
td.edit:hover input { border-color: #bfdbfe; }
td.edit input:focus { outline: none; border-color: var(--accent-2); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
/* Keep editable receivable values on the same right edge as the read-only amounts. */
td.edit input[type=number],
#detailTable td.edit[data-field="gst_tds"] input,
#detailTable td.edit[data-field="sd_expected"] input,
#detailTable td.edit[data-field="sd_received"] input,
#detailTable td.edit[data-field="fp_expected"] input,
#detailTable td.edit[data-field="fp_received"] input,
#detailTableDash td.edit[data-field="gst_tds"] input,
#detailTableDash td.edit[data-field="sd_expected"] input,
#detailTableDash td.edit[data-field="sd_received"] input,
#detailTableDash td.edit[data-field="fp_expected"] input,
#detailTableDash td.edit[data-field="fp_received"] input {
  text-align: right !important;
  text-align-last: right;
  padding-left: 0;
  padding-right: 0;
  margin-left: 0;
  display: block;
}
#detailTable td.edit[data-field="gst_tds"],
#detailTable td.edit[data-field="sd_expected"],
#detailTable td.edit[data-field="sd_received"],
#detailTable td.edit[data-field="fp_expected"],
#detailTable td.edit[data-field="fp_received"],
#detailTableDash td.edit[data-field="gst_tds"],
#detailTableDash td.edit[data-field="sd_expected"],
#detailTableDash td.edit[data-field="sd_received"],
#detailTableDash td.edit[data-field="fp_expected"],
#detailTableDash td.edit[data-field="fp_received"] {
  text-align: right !important;
}
/* The native number stepper occupies space inside the editable cell. Offset only
   the matching footer totals so their last digit sits below the value above. */
#detailTable tfoot td[data-field="gst_tds"],
#detailTable tfoot td[data-field="sd_expected"],
#detailTable tfoot td[data-field="sd_received"],
#detailTable tfoot td[data-field="fp_expected"],
#detailTable tfoot td[data-field="fp_received"],
#detailTableDash tfoot td[data-field="gst_tds"],
#detailTableDash tfoot td[data-field="sd_expected"],
#detailTableDash tfoot td[data-field="sd_received"],
#detailTableDash tfoot td[data-field="fp_expected"],
#detailTableDash tfoot td[data-field="fp_received"] {
  padding-right: 27px !important;
}
td.edit input[type=date] { text-align: center; font-size: 11px; width: 116px; }
.rowdel { opacity: 0; border: 0; background: transparent; color: #cbd5e1; cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; line-height: 1; }
tr:hover .rowdel { opacity: 1; }
.rowdel:hover { color: var(--red); background: #fee2e2; }
.flash { animation: cellflash .8s ease-out; }
@keyframes cellflash { 0% { background: #fde68a; } 100% { background: transparent; } }
/* ---------- data view ---------- */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }
.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; }
.export-card {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; cursor: pointer; background: #fff; text-align: left;
  font-family: inherit; transition: border-color .15s, box-shadow .15s;
}
.export-card:hover { border-color: var(--accent-2); box-shadow: 0 4px 14px rgba(37,99,235,.12); }
.fmt-chip { font-size: 10px; font-weight: 800; letter-spacing: .03em; color: #fff; border-radius: 7px; padding: 5px 7px; min-width: 46px; text-align: center; flex-shrink: 0; margin-top: 1px; }
.export-card b { display: block; font-size: 12.5px; margin-bottom: 3px; }
.export-card span { font-size: 11px; color: var(--muted); line-height: 1.4; display: block; }
#dropzone {
  border: 2px dashed #c7d2fe; border-radius: 12px; padding: 28px 18px; text-align: center;
  color: var(--muted); font-size: 12px; cursor: pointer; transition: all .15s; background: #f8faff; line-height: 1.7;
}
#dropzone:hover, #dropzone.drag { border-color: var(--accent-2); background: #eef4ff; color: var(--accent-2); }
#dropzone b { color: inherit; }
.workspace-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef2f7; font-size: 12px; flex-wrap: wrap; }
.workspace-row:last-child { border-bottom: 0; }
.workspace-row .grow { flex: 1; min-width: 120px; }
.kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; background: #f1f5f9; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
.muted { color: var(--muted); font-weight: 400; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; cursor: pointer; }
.chk input { accent-color: var(--accent-2); }
/* ---------- toasts / modal ---------- */
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {
  background: #0f172a; color: #f8fafc; font-size: 12px; padding: 10px 14px; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(15,23,42,.25); max-width: 360px; animation: toastin .25s ease-out; line-height: 1.45;
}
.toast.ok { background: #14532d; }
.toast.error { background: #7f1d1d; }
@keyframes toastin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
#modalRoot .overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: flex; align-items: center; justify-content: center; z-index: 90; padding: 20px;
}
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; box-shadow: 0 24px 64px rgba(15,23,42,.35); }
.modal.wide { max-width: 920px; }
.modal-head { padding: 15px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal-head h3 { margin: 0; font-size: 14px; }
.xclose { border: 0; background: transparent; font-size: 17px; cursor: pointer; color: var(--muted); line-height: 1; }
.xclose:hover { color: var(--ink); }
.modal-body { padding: 16px 20px; font-size: 12.5px; line-height: 1.55; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.form-grid label { font-size: 11px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.form-grid input, .form-grid select { padding: 7px 9px; font-weight: 400; color: var(--ink); width: 100%; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid .span2 { grid-column: span 2; }
.form-sec { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin: 14px 0 8px; }
.amt-grid {
  display: grid;
  grid-template-columns: minmax(150px, 1.3fr) 120px 170px minmax(150px, 1.4fr);
  gap: 6px 10px;
  align-items: center;
  margin: 0 0 12px;
}
.amt-grid .amt-h {
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); border-bottom: 1px solid var(--line); padding: 0 0 6px;
}
.amt-grid .amt-h:nth-child(2), .amt-grid .amt-h:nth-child(3) { text-align: right; }
.form-grid input[type=number] { text-align: right; font-variant-numeric: tabular-nums; }
.amt-grid .amt-name { font-size: 12px; font-weight: 700; color: var(--ink); }
.amt-grid .amt-base { font-size: 11px; color: var(--muted); }
.amt-grid input { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.amt-grid input.ro-amt, .form-grid input.ro-amt {
  background: #f8fafc; color: var(--ink); border-style: solid; cursor: default; text-align: right;
}
.amt-grid input.live-amt { background: #fff; text-align: right; }
.preview-line { margin-top: 12px; padding: 10px 12px; background: #f0f7ff; border: 1px solid #dbeafe; border-radius: 9px; font-size: 12px; line-height: 1.55; }
.row-actions { display: inline-flex; align-items: center; gap: 2px; }
.rowedit {
  opacity: .45; border: 0; background: transparent; color: #93c5fd; cursor: pointer;
  font-size: 13px; padding: 2px 6px; border-radius: 6px; line-height: 1;
}
.rowdel { opacity: .45; }
tr:hover .rowedit, tr:hover .rowdel { opacity: 1; }
.rowedit:hover { color: var(--accent-2); background: #eff6ff; }
.inv-link {
  color: var(--accent-2); font-weight: 700; text-decoration: underline; cursor: pointer;
  background: none; border: 0; padding: 0; font: inherit;
}
.inv-link:hover { color: #1d4ed8; }
.inv-link.empty { color: var(--muted); text-decoration: none; cursor: default; font-weight: 500; }
.inv-attach { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.inv-status { font-size: 11.5px; color: var(--muted); }
.mini-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
.mini-table th, .mini-table td { border: 1px solid var(--line); padding: 5px 8px; text-align: right; }
.mini-table th { background: #f8fafc; text-align: left; }
.mini-table td.left { text-align: left; }
@media (max-width: 900px) {
  #layout { flex-direction: column; }
  aside { width: 100%; height: auto; position: static; }
  nav { flex-direction: row; padding: 8px; flex-wrap: wrap; }
  .side-foot { display: none; }
  .brand { padding: 12px 14px; }
}
/* ---------- same-page drill-down + column manager ---------- */
.detail-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.detail-header h2 { margin: 0; }
.toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.th-wrap { display: inline-flex; align-items: center; gap: 4px; }
.th-pick {
  border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 10px;
  padding: 0 2px; border-radius: 4px; line-height: 1;
}
.th-pick:hover { background: #e2e8f0; color: var(--ink); }
.col-menu {
  position: fixed; z-index: 90; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,.16); min-width: 260px;
  max-height: min(380px, calc(100vh - 16px)); overflow: auto; padding: 6px;
}
.col-menu .cm-item .cm-label { flex: 1; min-width: 0; }
.col-menu .cm-item .cm-hint { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.col-menu .cm-title { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px 4px; }
.col-menu .cm-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
  border: 0; background: transparent; border-radius: 8px; cursor: pointer;
  font-size: 12px; text-align: left; font-family: inherit; color: var(--ink);
}
.col-menu .cm-item:hover { background: #f1f5f9; }
.col-menu .cm-item.active { background: #eff6ff; color: var(--accent-2); font-weight: 700; }
.col-menu .cm-item .cm-check { width: 14px; text-align: center; color: var(--accent-2); font-weight: 800; }
.col-picker-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 55; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,.16);
  width: 320px; max-height: 420px; display: none; overflow: hidden;
}
.col-picker-panel.open { display: flex; flex-direction: column; }
.col-picker-head { padding: 10px 12px 6px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.col-picker-list { overflow: auto; padding: 6px; max-height: 300px; }
.col-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 12px;
}
.col-row:hover { background: #f8fafc; }
.col-row .grow { flex: 1; min-width: 0; }
.col-row .ord { display: flex; flex-direction: column; gap: 1px; }
.col-row .ord button {
  border: 0; background: #f1f5f9; color: var(--muted); width: 18px; height: 14px; border-radius: 3px;
  cursor: pointer; font-size: 8px; line-height: 1; padding: 0;
}
.col-row .ord button:hover { background: #e2e8f0; color: var(--ink); }
.col-picker-foot { padding: 8px 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
/* Per-column on/off switches (one pill per column). */
.col-toggles { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 12px; }
.col-toggle {
  font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--line); border-radius: 99px; background: #fff; color: var(--ink);
  padding: 4px 11px; display: inline-flex; align-items: center; line-height: 1.2;
}
.col-toggle.on { border-color: var(--accent-2); background: var(--accent-2); color: #fff; }
.col-toggle.off { opacity: .55; }
.col-toggle:hover { border-color: var(--accent-2); }
.col-toggle.off:hover { opacity: .85; }
.gdrive-ico { width: 18px; height: 18px; flex-shrink: 0; }
.fmt-chip.gdrive { background: #1a73e8; letter-spacing: 0; }
.drive-fmt { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.drive-fmt button {
  border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px;
  font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.drive-fmt button.on { border-color: var(--accent-2); background: #eff6ff; color: var(--accent-2); }
.drive-status { font-size: 12px; color: var(--muted); line-height: 1.5; min-height: 1.4em; }
.drive-status.ok { color: var(--green); }
.drive-status.err { color: var(--red); }
#dashDetailPanel { scroll-margin-top: 72px; }
tbody tr.drill-target { outline: 2px solid #93c5fd; outline-offset: -2px; }
.quick-add-row td { background: #f8faff; }
.quick-add-row input {
  width: 100%; border: 1px dashed #c7d2fe; background: #fff; border-radius: 6px;
  padding: 3px 6px; font: inherit; color: inherit;
}
.quick-add-row input:focus { outline: none; border-color: var(--accent-2); border-style: solid; box-shadow: 0 0 0 3px rgba(37,99,235,.14); }
.col-type { font-size: 10px; color: var(--muted); font-weight: 600; }
/* Match Pivot Analytics: show a dash for missing SD/FP dates while keeping the cell editable. */
.date-empty-editor { position: relative; width: 100%; }
.date-empty-editor .empty-mark {
  position: absolute; inset: 0; z-index: 2; display: none; align-items: center;
  justify-content: center; color: var(--muted); cursor: pointer;
}
.date-empty-editor.is-empty .empty-mark { display: flex; }
.date-empty-editor:focus-within .empty-mark { display: none; }
/* Hide the browser's locale-specific empty date placeholder (for example, mm-dd-yyyy)
   until the user focuses the editable field. */
.date-empty-editor.is-empty > input[type=date] { opacity: 0; }
.date-empty-editor.is-empty:focus-within > input[type=date] { opacity: 1; }
/* Filled dates stay clean; the date input remains editable by clicking its value. */
.date-empty-editor.has-date > input[type=date]::-webkit-calendar-picker-indicator { display: none; }
</style>

<script id="core">
"use strict";
/* ================================================================
   ScrapSale Pro — core (pure data & file-format engine, no DOM)
   ================================================================ */

/* ---------------- basic helpers ---------------- */
function inr(n, decimals) {
  decimals = (decimals === undefined) ? 0 : decimals;
  if (n === null || n === undefined || isNaN(n)) return '—';
  var neg = n < 0;
  n = Math.abs(Math.round(n * Math.pow(10, decimals)) / Math.pow(10, decimals));
  var parts = n.toFixed(decimals).split('.');
  var whole = parts[0], frac = parts[1];
  var last3 = whole.slice(-3), rest = whole.slice(0, -3);
  if (rest) whole = rest.replace(/\\B(?=(\\d{2})+(?!\\d))/g, ',') + ',' + last3;
  else whole = last3;
  var out = (neg ? '-' : '') + whole;
  if (frac) out += '.' + frac;
  return out;
}
function escHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function isFiniteNum(v) { return typeof v === 'number' && isFinite(v); }
function numOr(v, d) { var n = Number(v); return isFinite(n) ? n : (d || 0); }
function strOr(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }
function sumField(rows, f) { return rows.reduce(function (a, r) { return a + (isFiniteNum(r[f]) ? r[f] : 0); }, 0); }
function computeStats(lots) {
  var s = { lots: lots.length, mat_value: 0, gst: 0, total_receivables: 0, total_received: 0,
            outstanding: 0, sd_received: 0, fp_received: 0, sd_expected: 0, fp_expected: 0, buyers: 0, auctions: 0, collection: 0 };
  var bs = {}, as = {};
  for (var i = 0; i < lots.length; i++) {
    var r = lots[i];
    s.mat_value += numOr(r.mat_value); s.gst += numOr(r.gst);
    s.total_receivables += numOr(r.total_receivables); s.total_received += numOr(r.total_received);
    s.outstanding += numOr(r.outstanding); s.sd_received += numOr(r.sd_received);
    s.fp_received += numOr(r.fp_received); s.sd_expected += numOr(r.sd_expected); s.fp_expected += numOr(r.fp_expected);
    bs[strOr(r.buyer)] = 1; as[r.auction] = 1;
  }
  s.buyers = Object.keys(bs).length; s.auctions = Object.keys(as).length;
  s.collection = s.total_receivables > 0 ? Math.round(s.total_received / s.total_receivables * 100) : 0;
  return s;
}
function toISODate(s) {
  if (!s) return '';
  var str = String(s);
  var m = str.match(/^(\\d{1,2})[.\\-/](\\d{1,2})[.\\-/](\\d{2,4})/);
  if (!m) return /^\\d{4}-\\d{2}-\\d{2}$/.test(str) ? str : '';
  var y = m[3]; if (y.length === 2) y = '20' + y;
  return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
}
function fromISODate(iso) {
  if (!iso) return null;
  var m = String(iso).match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
  if (!m) return String(iso);
  return m[3] + '.' + m[2] + '.' + m[1];
}

/* ---------------- data model ----------------
   total_receivables = mat_value + gst + tcs - net_service_charge - tds194o - gst_tds
   sd_expected (auto)  = round(mat_value * 25%)          (security deposit)
   fp_expected (auto)  = total_receivables - sd_expected
   total_received      = sd_received + fp_received
   outstanding         = total_receivables - total_received
   gst_tds (auto when >0) = round(gst / 9)               (TDS on GST)                                        */
var NUM_FIELDS = ['qty','rate','mat_value','mat_value_plus_gst','gst','tcs','service_charge_mstc','tds194h','net_service_charge','service_charge_to_mstc','tds194o','gst_tds_rate','gst_tds','total_receivables','sd_expected','sd_received','fp_expected','fp_received','short_excess_payment','total_received','outstanding'];
var DATE_FIELDS = ['sd_date','fp_date','sap_document_date','doc_invoice_date'];
var EDITABLE_FIELDS = ['gst_tds_rate','gst_tds','sd_expected','sd_received','sd_date','fp_expected','fp_received','fp_date'];

function cleanNum(v) {
  if (typeof v === 'string') {
    var t = v.trim();
    if (/^-?[\\d,]+(\\.\\d+)?$/.test(t)) v = t.replace(/,/g, '');
  }
  return v;
}
function normalizeLot(raw) {
  raw = raw || {};
  function has(k) { return raw[k] !== undefined && raw[k] !== null && String(raw[k]).trim() !== ''; }
  function N(k) { return numOr(cleanNum(raw[k])); }
  function D(k) {
    var v = strOr(raw[k]);
    return (!v || v === '0' || v === '—') ? null : v;
  }
  var r = {};
  r.lot_no = has('lot_no') ? N('lot_no') : 0;
  r.invoice_no = strOr(raw.invoice_no);
  r.invoice_link = strOr(raw.invoice_link);
  r.buyer = strOr(raw.buyer);
  r.auction = has('auction') ? N('auction') : 0;
  r.lot_name = strOr(raw.lot_name);
  r.unit = strOr(raw.unit) || 'NO';
  r.qty = N('qty');
  r.rate = N('rate');
  r.mat_value = has('mat_value') ? N('mat_value') : Math.round(r.qty * r.rate * 100) / 100;
  r.gst = N('gst');
  r.mat_value_plus_gst = has('mat_value_plus_gst') ? N('mat_value_plus_gst') : (r.mat_value + r.gst);
  r.tcs = N('tcs');
  r.service_charge_mstc = has('service_charge_mstc') ? N('service_charge_mstc') : 0;
  r.tds194h = has('tds194h') ? N('tds194h') : 0;
  r.net_service_charge = has('net_service_charge') ? N('net_service_charge') : (r.service_charge_mstc - r.tds194h);
  r.service_charge_to_mstc = has('service_charge_to_mstc') ? N('service_charge_to_mstc') : r.service_charge_mstc;
  r.tds194o = N('tds194o');
  r.gst_tds = N('gst_tds');
  if (has('gst_tds_rate')) {
    r.gst_tds_rate = N('gst_tds_rate');
    /* Excel stores 2% as 0.02; the app displays and edits percentage points. */
    if (r.gst_tds_rate > 0 && r.gst_tds_rate < 1) r.gst_tds_rate = Math.round(r.gst_tds_rate * 10000) / 100;
  } else if (r.mat_value) {
    r.gst_tds_rate = Math.round(r.gst_tds / r.mat_value * 10000) / 100;
  } else {
    r.gst_tds_rate = 0;
  }
  r._gstTdsAuto = !has('gst_tds') || r.gst_tds > 0;
  r.total_receivables = has('total_receivables') ? N('total_receivables')
    : Math.round(r.mat_value + r.gst + r.tcs - r.tds194o - r.net_service_charge - r.gst_tds);
  r.sd_expected = has('sd_expected') ? N('sd_expected') : Math.round(r.mat_value * 0.25);
  r.fp_expected = has('fp_expected') ? N('fp_expected') : (r.total_receivables - r.sd_expected);
  r.sd_received = N('sd_received');
  r.fp_received = N('fp_received');
  r.sd_date = D('sd_date');
  r.fp_date = D('fp_date');
  r.total_received = has('total_received') ? N('total_received') : (r.sd_received + r.fp_received);
  r.outstanding = has('outstanding') ? N('outstanding') : (r.total_receivables - r.total_received);
  r.short_excess_payment = has('short_excess_payment') ? N('short_excess_payment') : r.outstanding;
  r.sap_document_date = D('sap_document_date');
  r.doc_invoice_date = D('doc_invoice_date');
  var m = raw.manual || {};
  var sdDerived = Math.round(r.mat_value * 0.25);
  var fpDerived = r.total_receivables - r.sd_expected;
  r._manual = {
    sd_expected: m.sd_expected === true || (has('sd_expected') && Math.abs(r.sd_expected - sdDerived) > 1),
    fp_expected: m.fp_expected === true || (has('fp_expected') && Math.abs(r.fp_expected - fpDerived) > 1)
  };
  r._extra = {};
  var ex = raw._extra || raw.extra;
  if (ex && typeof ex === 'object') Object.keys(ex).forEach(function (k) { r._extra[k] = strOr(ex[k]); });
  return r;
}
function recalcRow(r, changed) {
  changed = changed || [];
  function n(k) { return numOr(r[k]); }
  if (!r._manual) r._manual = {};
  if (changed.indexOf('gst_tds_rate') !== -1) {
    r.gst_tds = Math.round(n('mat_value') * n('gst_tds_rate') / 100);
    r._gstTdsAuto = true;
    r._manual.gst_tds = false;
  }
  if (changed.indexOf('gst_tds') !== -1) {
    r._gstTdsAuto = false;
    r._manual.gst_tds = true;
    r.gst_tds_rate = n('mat_value') ? Math.round(n('gst_tds') / n('mat_value') * 10000) / 100 : 0;
  }
  if (changed.indexOf('gst') !== -1 && r._gstTdsAuto) {
    r.gst_tds = Math.round(n('mat_value') * n('gst_tds_rate') / 100);

function buildPivotAnalyticsSheet(lots) {
  var groups = [
    { title: 'By Buyer', key: 'buyer', header: 'Buyer', keys: uniqueKeys(lots, 'buyer') },
    { title: 'By Auction', key: 'auction', header: 'Auction', keys: uniqueKeys(lots, 'auction') },
    { title: 'By Material type', key: 'lot_name', header: 'Material', keys: uniqueKeys(lots, 'lot_name') },
    { title: 'By Unit', key: 'unit', header: 'Unit', keys: uniqueKeys(lots, 'unit') }
  ];
  var stats = computeStats(lots);
  var rows = [];
  function pushRow(r, cells) { rows.push('<row r="' + r + '">' + cells.join('') + '</row>'); }
  pushRow(1, [cellInline('A1', 'ScrapSale Pro — Pivot Analytics (live formulas)', 6)]);
  pushRow(2, [cellInline('A2', 'SUMIF / COUNTIF against table CashReceivables. Change a figure on Cash Receivables and this sheet updates. Collection % = Total Received ÷ Total Receivables.', 7)]);
  var kpi = [
    ['Lots', 'COUNTA(CashReceivables[Lot No])', stats.lots, ''],
    ['Buyers', 'COUNTA(DimBuyer[Buyer])', stats.buyers, ''],
    ['Material Value', 'SUM(CashReceivables[Material Value])', stats.mat_value, 2],
    ['Total Receivables in Cash', 'SUM(CashReceivables[Total Receivables in Cash])', stats.total_receivables, 2],
    ['Total Received', 'SUM(CashReceivables[Total Received])', stats.total_received, 2],
    ['Outstanding', 'SUM(CashReceivables[Outstanding])', stats.outstanding, 2],
    ['Collection %', 'IF(D5=0,0,E5/D5)', stats.total_receivables ? stats.total_received / stats.total_receivables : 0, 8]
  ];
  /* compact KPI on row 4-5 */
  var kLab = [], kVal = [];
  kpi.forEach(function (k, i) {
    var L = colLetter(i);
    kLab.push(cellInline(L + '4', k[0], 1));
    kVal.push(cellFormula(L + '5', k[1], k[2], k[3]));
  });
  pushRow(4, kLab);
  pushRow(5, kVal);

  var r = 7;
  groups.forEach(function (g) {
    pushRow(r, [cellInline('A' + r, g.title, 6)]);
    r++;
    var heads = [cellInline('A' + r, g.header, 4)];
    PIVOT_VALUE_COLS.forEach(function (m, i) {
      heads.push(cellInline(colLetter(i + 1) + r, m[1], 4));
    });
    heads.push(cellInline(colLetter(PIVOT_VALUE_COLS.length + 1) + r, 'Collection %', 4));
    pushRow(r, heads);
    var headerRow = r;
    r++;
    var firstData = r;
    g.keys.forEach(function (name) {
      var grp = lots.filter(function (x) { return String(x[g.key]) === name; });
      var cells = [cellInline('A' + r, name, 1)];
      PIVOT_VALUE_COLS.forEach(function (m, i) {
        var L = colLetter(i + 1);
        var tbl = PIVOT_TABLE_COL[m[0]];
        var formula, cached;
        if (m[2] === 'count') {
          formula = 'COUNTIF(CashReceivables[' + g.header + '],A' + r + ')';
          cached = grp.length;
        } else {
          formula = 'SUMIF(CashReceivables[' + g.header + '],A' + r + ',CashReceivables[' + tbl + '])';
          cached = sumField(grp, m[0]);
        }
        cells.push(cellFormula(L + r, formula, cached, m[0] === 'lots' ? '' : 2));
      });
      var recL = colLetter(1 + PIVOT_VALUE_COLS.findIndex(function (m) { return m[0] === 'total_received'; }));
      var tricL = colLetter(1 + PIVOT_VALUE_COLS.findIndex(function (m) { return m[0] === 'total_receivables'; }));
      var collL = colLetter(PIVOT_VALUE_COLS.length + 1);
      var coll = sumField(grp, 'total_receivables') ? sumField(grp, 'total_received') / sumField(grp, 'total_receivables') : 0;
      cells.push(cellFormula(collL + r, 'IF(' + tricL + r + '=0,0,' + recL + r + '/' + tricL + r + ')', coll, 8));
      pushRow(r, cells);
      r++;
    });
    var lastData = r - 1;
    if (g.keys.length) {
      var tot = [cellInline('A' + r, 'TOTAL', 3)];
      PIVOT_VALUE_COLS.forEach(function (m, i) {
        var L = colLetter(i + 1);
        var cached = m[2] === 'count' ? lots.length : sumField(lots, m[0]);
        tot.push(cellFormula(L + r, 'SUM(' + L + firstData + ':' + L + lastData + ')', cached, 3));
      });
      var recL = colLetter(1 + PIVOT_VALUE_COLS.findIndex(function (m) { return m[0] === 'total_received'; }));
      var tricL = colLetter(1 + PIVOT_VALUE_COLS.findIndex(function (m) { return m[0] === 'total_receivables'; }));
      var collL = colLetter(PIVOT_VALUE_COLS.length + 1);
      var coll = stats.total_receivables ? stats.total_received / stats.total_receivables : 0;
      tot.push(cellFormula(collL + r, 'IF(' + tricL + r + '=0,0,' + recL + r + '/' + tricL + r + ')', coll, 8));
      pushRow(r, tot);
      r++;
    }
    r += 2;
  });
  var colsDef = '<cols><col min="1" max="1" width="42"/><col min="2" max="14" width="16"/></cols>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="16"/>' + colsDef +
    '<sheetData>' + rows.join('') + '</sheetData>' +
    '</worksheet>';
}

function parseTXT(text, customCols) {
  customCols = customCols || [];
  var lines = String(text).split(/\\r\\n|\\n|\\r/);
  function skipLine(line) {
    var t = line.trim();
    if (t === '' || /^[\\s=|-]+$/.test(line)) return true;
    if (t.indexOf('SCRAPSALE') === 0 || t.indexOf('Generated:') === 0 || t.indexOf('TOTALS |') === 0 || t.indexOf('Formula:') === 0) return true;
    return false;
  }
  var headerIdx = -1, hmap = null, probe = null;
  for (var i = 0; i < lines.length; i++) {
    if (skipLine(lines[i])) continue;
    probe = lines[i].split(/\\s{2,}/).map(function (s) { return s.trim(); });
    var m = mapHeaderRow(probe);
    var fs = Object.keys(m).map(function (k) { return m[k]; });
    if (fs.indexOf('lot_no') !== -1 && fs.indexOf('buyer') !== -1) { headerIdx = i; hmap = m; break; }
  }
  if (headerIdx < 0) throw new Error('Could not find the TXT report header row');
  // column start offsets for EVERY header cell (mapped + custom)
  var headerLine = lines[headerIdx], starts = [], prev = 0;
  for (var pi = 0; pi < probe.length; pi++) {
    var pos = headerLine.indexOf(probe[pi], prev);
    if (pos < 0) pos = prev;
    starts.push(pos);
    prev = pos + Math.max(probe[pi].length, 1);
  }
  var colOrder = Object.keys(hmap).map(Number).sort(function (a, b) { return a - b; });
  var extraCols = [];
  probe.forEach(function (label, ci) {
    if (hmap[ci] !== undefined || !strOr(label)) return;
    for (var k = 0; k < customCols.length; k++) {
      if (customCols[k].toLowerCase() === label.toLowerCase()) { extraCols.push([ci, customCols[k]]); break; }
    }
  });
  var lots = [];
  for (var j = headerIdx + 1; j < lines.length; j++) {
    var ln = lines[j];
    if (skipLine(ln)) continue;
    var first = ln.replace(/^\\s+/, '').split(/\\s{2,}/)[0] || '';
    if (/^TOTAL$/i.test(first)) continue; // grand totals row
    var cells = [];
    for (var ci2 = 0; ci2 < colOrder.length; ci2++) {
      var s = starts[ci2], e = ci2 + 1 < starts.length ? starts[ci2 + 1] : ln.length;
      cells.push(ln.slice(s, e).replace(/,/g, '').trim());
    }
    if (!cells.some(function (c) { return c !== ''; })) continue;
    var obj = {};
    colOrder.forEach(function (ci3, idx) { obj[hmap[ci3]] = cells[idx]; });
    extraCols.forEach(function (ec) {
      var e2 = ec[0] + 1 < starts.length ? starts[ec[0] + 1] : ln.length;
      obj._extra = obj._extra || {};
      obj._extra[ec[1]] = ln.slice(starts[ec[0]], e2).trim();
    });
    if (strOr(obj.buyer).toUpperCase() === 'TOTAL') continue;
    lots.push(normalizeLot(obj));
  }
  if (!lots.length) throw new Error('No data rows found in TXT report');
  return lots;
}

/* ---------------- invoice PDFs (IndexedDB local + Drive/URL) ---------------- */
var INV_DB = 'scrapsale_invoices_v1';
var pendingInvoiceFile = null;
var pendingInvoiceClear = false;
function invoiceDb() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(INV_DB, 1);
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs');
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function invoiceKey(lot) {
  if (lot && typeof lot === 'object') return String(lot.lot_no);
  return String(lot);
}
function invoicePut(key, file) {
  return invoiceDb().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction('pdfs', 'readwrite');
      tx.objectStore('pdfs').put({ name: file.name, type: file.type || 'application/pdf', blob: file }, String(key));
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}
function invoiceGet(key) {
  return invoiceDb().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction('pdfs', 'readonly');
      var rq = tx.objectStore('pdfs').get(String(key));
      rq.onsuccess = function () { resolve(rq.result || null); };
      rq.onerror = function () { reject(rq.error); };
    });
  });
}
function invoiceDel(key) {
  return invoiceDb().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction('pdfs', 'readwrite');
      tx.objectStore('pdfs').delete(String(key));
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}
function invoiceHas(key) {
  return invoiceGet(key).then(function (r) { return !!(r && r.blob); });
}
function normalizeInvoiceUrl(url) {
  url = strOr(url);
  if (!url) return '';
  var idM = url.match(/\\/d\\/([a-zA-Z0-9_-]{20,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if (/drive\\.google\\.com/i.test(url) && idM) return 'https://drive.google.com/file/d/' + idM[1] + '/view';
  if (/^https?:\\/\\//i.test(url)) return url;
  return url;
}
function markInvoiceButtons() {
  document.querySelectorAll('button.inv-link').forEach(function (btn) {
    var no = btn.getAttribute('data-inv-lot');
    if (!no) return;
    invoiceHas(no).then(function (ok) {
      if (!ok) return;
      btn.classList.remove('empty');
      if (btn.textContent === '—' || !String(btn.textContent).trim()) btn.textContent = 'PDF';
      btn.title = 'Open invoice PDF';
    }).catch(function () {});
  });
}
function invoiceCellHtml(r) {
  var no = strOr(r.invoice_no);
  var hasLink = !!strOr(r.invoice_link);
  var label = no || (hasLink ? 'Open PDF' : '—');
  var cls = (no || hasLink) ? 'inv-link' : 'inv-link empty';
  return '<button type="button" class="' + cls + '" data-inv-lot="' + escHtml(r.lot_no) + '" title="' +
    (no || hasLink ? 'Open invoice PDF (Google Drive or local file)' : 'No invoice PDF') + '">' + escHtml(label) + '</button>';
}
function openInvoiceForLot(lotOrNo) {
  var lot = (lotOrNo && typeof lotOrNo === 'object') ? lotOrNo : lots.find(function (x) { return String(x.lot_no) === String(lotOrNo); });
  if (!lot) { showToast('Lot not found.', 'error'); return; }
  var key = invoiceKey(lot);
  invoiceGet(key).then(function (rec) {
    if (rec && rec.blob) {
      var url = URL.createObjectURL(rec.blob);
      var w = window.open(url, '_blank');
      if (!w) showToast('Allow pop-ups to open the invoice PDF.', 'error');
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
      return;
    }
    var link = normalizeInvoiceUrl(lot.invoice_link);
    if (link) {
      var w2 = window.open(link, '_blank', 'noopener');
      if (!w2) showToast('Allow pop-ups to open the invoice.', 'error');
      return;
    }
    showToast('No invoice PDF for lot ' + lot.lot_no + '. Attach a local PDF or paste a Google Drive link in Edit row.', 'error');
  }).catch(function () {
    var link = normalizeInvoiceUrl(lot.invoice_link);
    if (link) window.open(link, '_blank', 'noopener');
    else showToast('Could not open the local PDF store. Use a Google Drive link instead.', 'error');
  });
}

/* history: 10-step undo/redo */
var MAX_HISTORY = 10;
var hist = { undo: [], redo: [] };
function snapshotState() {
  return JSON.stringify({ lots: lots, customCols: customCols, colLayout: colLayout });
}
function applySnapshot(raw) {
  var d = JSON.parse(raw);
  if (d && Array.isArray(d.lots)) {
    lots = d.lots;
    if (Array.isArray(d.customCols)) customCols = d.customCols;
    if (d.colLayout && typeof d.colLayout === 'object') colLayout = d.colLayout;
  } else if (Array.isArray(d)) {
    lots = d;
  }
}
function pushHistory(snap) {
  hist.undo.push(snap || snapshotState());
  if (hist.undo.length > MAX_HISTORY) hist.undo.shift();
  hist.redo.length = 0;
  updateUndoRedoUI();
}
function undo() {
  if (!hist.undo.length) return;
  hist.redo.push(snapshotState());
  applySnapshot(hist.undo.pop());
  afterStateChange('Undo');
}
function redo() {
  if (!hist.redo.length) return;
  hist.undo.push(snapshotState());
  applySnapshot(hist.redo.pop());
  afterStateChange('Redo');
}
function updateUndoRedoUI() {
  document.getElementById('undoCount').textContent = hist.undo.length;
  document.getElementById('redoCount').textContent = hist.redo.length;
  document.getElementById('undoBtn').disabled = !hist.undo.length;
  document.getElementById('redoBtn').disabled = !hist.redo.length;
}

function loadScriptOnce(src, id) {
  return new Promise(function (resolve, reject) {
    if (id && document.getElementById(id)) { resolve(); return; }
    var s = document.createElement('script');
    if (id) s.id = id;
    s.src = src; s.async = true;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error('Could not load ' + src)); };
    document.head.appendChild(s);
  });
}
function tsvForSheets(rows) {
  var names = currentCustomColNames();
  var cols = EXPORT_COLS.concat(names.map(function (n) { return [n, n]; }));
  function cell(v) {
    v = v === null || v === undefined ? '' : String(v);
    return v.replace(/\\t/g, ' ').replace(/\\r?\\n/g, ' ');
  }
  var lines = [cols.map(function (c) { return cell(c[1]); }).join('\\t')];
  rows.forEach(function (r) {
    lines.push(cols.map(function (c, i) {
      if (i >= EXPORT_COLS.length) return cell(strOr(r._extra && r._extra[c[0]]));
      return cell(r[c[0]]);
    }).join('\\t'));
  });
  return lines.join('\\n');
}

function fallbackCopy(text) {

  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('Copied as spreadsheet rows — paste into Google Sheets.', 'ok'); }

function setDriveStatus(msg, cls) {
  var el = document.getElementById('driveStatus');
  if (!el) return;
  el.textContent = msg;
  el.className = 'drive-status' + (cls ? ' ' + cls : '');
}
function startDriveUpload(lotsToExport) {
  var cidInput = document.getElementById('driveCid');
  var cid = strOr(cidInput && cidInput.value) || gdriveClientId;
  if (!cid) {
    setDriveStatus('Add a Google OAuth Client ID above, or use Download + open Drive.', 'err');
    return;
  }
  gdriveClientId = cid;
  saveState();
  var fmt = (document.querySelector('#driveFmt button.on') || {}).dataset.fmt || 'sheet';
  setDriveStatus('Connecting to Google…');
  loadScriptOnce('https://accounts.google.com/gsi/client', 'gis-client').then(function () {
    if (!window.google || !google.accounts || !google.accounts.oauth2) throw new Error('Google Identity Services did not load');
    var client = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: function (resp) {
        if (resp.error) { setDriveStatus('Sign-in failed: ' + (resp.error_description || resp.error), 'err'); return; }
        gdriveToken = resp.access_token;
        uploadToDrive(lotsToExport, fmt, gdriveToken);
      }
    });
    client.requestAccessToken({ prompt: gdriveToken ? '' : 'consent' });
  }).catch(function (e) {
    setDriveStatus(e.message + ' — use Download + open Drive instead.', 'err');
  });
}
function uploadToDrive(lotsToExport, fmt, token) {
  setDriveStatus('Uploading…');
  var name = 'ScrapSale Receivables ' + stampName();
  var meta, bodyBlob, convert = false;
  try {
    if (fmt === 'sheet') {
      var csv = csvExport(lotsToExport, currentCustomColNames());
      meta = { name: name, mimeType: 'application/vnd.google-apps.spreadsheet' };
      bodyBlob = new Blob([csv], { type: 'text/csv' });
      convert = true;
    } else {
      var built = buildExportBytes(fmt, lotsToExport);
      meta = { name: name + built.ext, mimeType: built.mime };
      bodyBlob = built.bytes instanceof Blob ? built.bytes : new Blob([built.bytes], { type: built.mime });
    }
  } catch (e) {
    setDriveStatus('Could not build file: ' + e.message, 'err');
    return;
  }
  var boundary = '-------scrapsale' + Date.now();
  var reader = new FileReader();
  reader.onload = function () {
    var multipart =
      '--' + boundary + '\\r\\nContent-Type: application/json; charset=UTF-8\\r\\n\\r\\n' +
      JSON.stringify(meta) + '\\r\\n' +
      '--' + boundary + '\\r\\nContent-Type: ' + (meta.mimeType === 'application/vnd.google-apps.spreadsheet' ? 'text/csv' : meta.mimeType) + '\\r\\n\\r\\n';
    var tail = '\\r\\n--' + boundary + '--';
    var head = new TextEncoder().encode(multipart);
    var fileBytes = new Uint8Array(reader.result);
    var end = new TextEncoder().encode(tail);
    var all = new Uint8Array(head.length + fileBytes.length + end.length);
    all.set(head, 0); all.set(fileBytes, head.length); all.set(end, head.length + fileBytes.length);
    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,mimeType', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: all
    }).then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
      .then(function (out) {
        if (!out.ok) {
          var msg = (out.j && out.j.error && out.j.error.message) || 'Upload failed';
          setDriveStatus(msg, 'err');
          showToast('Google Drive: ' + msg, 'error');
          return;
        }
        var link = out.j.webViewLink || ('https://drive.google.com/file/d/' + out.j.id + '/view');
        setDriveStatus('Uploaded “' + (out.j.name || name) + '”. Opening…', 'ok');
        showToast('Uploaded to Google Drive', 'ok');
        window.open(link, '_blank', 'noopener');
      }).catch(function (e) { setDriveStatus('Upload error: ' + e.message, 'err'); });
  };
  reader.onerror = function () { setDriveStatus('Could not read the file for upload.', 'err'); };
  reader.readAsArrayBuffer(bodyBlob);
}

        pushHistory();

/* ---------------- import ---------------- */
function handleImportFile(file) {
  var name = (file.name || '').toLowerCase();
  file.arrayBuffer().then(function (buf) {
    var dec = new TextDecoder();
    var text = dec.decode(buf);
    var run = function (result) {
      if (result && result.then) result.then(function (l) { showImportConfirm(file.name, l); }).catch(function (e) { showToast('Import failed: ' + e.message, 'error'); });
      else showImportConfirm(file.name, result);
    };
    try {
      if (name.endsWith('.xlsx')) {
        var rows = parseXlsxFile(buf);
        run(gridToLots(rows));
      } else if (name.endsWith('.xls')) {
        throw new Error('Legacy .xls is not supported — save it as .xlsx in Excel first.');
      } else if (name.endsWith('.csv')) run(gridToLots(parseCSV(text)));
      else if (name.endsWith('.txt')) run(parseTXT(text));
      else if (name.endsWith('.json')) {
        pendingImportCustom = [];
        try {
          var jdata = JSON.parse(text);
          if (jdata && Array.isArray(jdata.custom_columns)) {
            pendingImportCustom = jdata.custom_columns.map(function (n) {
              return typeof n === 'string' ? n : (n && n.name);
            }).filter(Boolean);
          }
        } catch (ignore) {}
        run(parseJSONImport(text));
      }
      else if (name.endsWith('.html') || name.endsWith('.htm')) run(parseHTMLTable(text));
      else if (name.endsWith('.pdf')) throw new Error('PDF is export-only. Export XLSX/CSV from here to import data back.');
      else throw new Error('Unsupported file type: ' + file.name);
    } catch (e) {
      showToast('Import failed: ' + e.message, 'error');
    }
  }).catch(function (e) { showToast('Could not read file: ' + e.message, 'error'); });
}
function showImportConfirm(fileName, imported) {
  var s = computeStats(imported);
  var preview = imported.slice(0, 5).map(function (r) {
    return '<tr><td class="left">' + escHtml(r.lot_no) + '</td><td class="left">' + escHtml(r.buyer) + '</td><td>' + inr(r.total_receivables) + '</td><td>' + inr(r.total_received) + '</td><td>' + inr(r.outstanding) + '</td></tr>';
  }).join('');
  var modal = openModal({

function adoptCustomColsFromLots(imported, names) {

  (names || []).forEach(function (n) { if (n && found.indexOf(n) === -1) found.push(n); });
  imported.forEach(function (r) {
    if (!r._extra) return;
    Object.keys(r._extra).forEach(function (k) {
      if (!k || k.indexOf('c_') === 0) return;
      if (found.indexOf(k) === -1) found.push(k);
    });
  });
  found.forEach(function (n) {
    if (!n || known[String(n).toLowerCase()]) return;
    var id = slugColId();
    customCols.push({ id: id, name: n, type: 'text' });
    if (colLayout.detail.indexOf(id) === -1) colLayout.detail.push(id);

function applyImport(imported, mode) {

    lots = imported;

    var byId = new Map();
    lots.forEach(function (r, i) { byId.set(String(r.lot_no), i); });
    var updated = 0, added = 0;
    imported.forEach(function (r) {
      var k = String(r.lot_no);
      if (byId.has(k)) { lots[byId.get(k)] = r; updated++; }
      else { byId.set(k, lots.length); lots.push(r); added++; }

}

function pctOf(part, base) {
  base = numOr(base);
  if (!base) return 0;
  return Math.round(numOr(part) / base * 1e6) / 1e4;
}
function lotFormRatesFrom(r) {
  if (!r) {
    return { gst: 18, tcs: 2, sc: 2.25, tds194h: 2, tds194o: 0.1, gst_tds: 0, sd: 25 };

  var mat = numOr(r.mat_value);
  var gst = numOr(r.gst);
  var sc = numOr(r.service_charge_mstc);
  return {
    gst: pctOf(gst, mat),
    tcs: pctOf(r.tcs, mat + gst),
    sc: pctOf(sc, mat + gst),
    tds194h: pctOf(r.tds194h, mat * 0.0225) || 2,
    tds194o: pctOf(r.tds194o, mat),
    gst_tds: (r.gst_tds_rate !== undefined && r.gst_tds_rate !== null && r.gst_tds_rate !== '') ? numOr(r.gst_tds_rate) : pctOf(r.gst_tds, mat),
    sd: pctOf(r.sd_expected, mat) || 25
  };
}
function pairFrom(src, pctId, amtId, base) {
  var pctEl = document.getElementById(pctId);
  var amtEl = document.getElementById(amtId);
  var pct, amt;
  if (src === amtId) {
    amt = numOr(amtEl && amtEl.value);
    pct = pctOf(amt, base);
    if (pctEl && src !== pctId) pctEl.value = pct;
  } else {
    pct = numOr(pctEl && pctEl.value);
    amt = Math.round(numOr(base) * pct / 100);
  }

}
function computeLotForm(src) {

function buildKPI(){
  const totalMV=RAW.reduce((s,r)=>s+r['Mat. Value'],0);
  const totalRec=WORK.reduce((s,r)=>s+(r['Total Receivable']||0),0);
  const sdRec=WORK.reduce((s,r)=>s+(r['SD Received']||0),0);
  const fpRec=WORK.reduce((s,r)=>s+(r['FP Received']||0),0);
  const outstanding=WORK.reduce((s,r)=>s+(r['Outstanding']>0?r['Outstanding']:0),0);
  const buyers=[...new Set(WORK.map(r=>r.Buyer))].length;
  const kpis=[
    {label:'Total Mat. Value',val:fmt(totalMV),sub:'37 lots · 4 auctions',cls:'c'},
    {label:'Total Receivables',val:fmt(totalRec),sub:'incl. GST + TCS + SC',cls:'v'},
    {label:'SD Collected',val:fmt(sdRec),sub:'Security deposits received',cls:'g'},
    {label:'FP Collected',val:fmt(fpRec),sub:'Final payments received',cls:'a'},
    {label:'Outstanding',val:fmt(outstanding),sub:'Payments still pending',cls:'p'},
    {label:'Unique Buyers',val:buyers,sub:'Active bidder companies',cls:'c'},
  ];
  const grid=document.getElementById('kpiGrid');
  grid.innerHTML='';
  kpis.forEach(k=>{
    const d=el('div',`kpi ${k.cls}`);
    d.innerHTML=`<div class="kpi-label">${k.label}</div><div class="kpi-val">${k.val}</div><div class="kpi-sub">${k.sub}</div>`;
    grid.appendChild(d);
  });
}
buildKPI();

// GENERIC SORTABLE TABLE
// ═══════════════════════════════════════════════════════
function makeTable(cols,data,opts={}){
  // cols: [{key,label,num,badge,width}]
  // opts: {onEdit, totals, rowSelect}
  let sortKey=cols[0].key, sortDir='asc', selected=new Set();

  const wrap=el('div','tbl-wrap');
  const tbl=el('table');
  const thead=el('thead');const hr=el('tr');
  if(opts.rowSelect){const th=el('th','');th.style.width='32px';hr.appendChild(th);}
  cols.forEach(c=>{
    const th=el('th','');
    th.innerHTML=`${c.label||c.key}<span class="sort-arrow">⇅</span>`;
    if(c.width)th.style.width=c.width;
    th.addEventListener('click',()=>{
      if(sortKey===c.key)sortDir=sortDir==='asc'?'desc':'asc';
      else{sortKey=c.key;sortDir='asc';}
      render();
    });
    hr.appendChild(th);
  });
  thead.appendChild(hr);tbl.appendChild(thead);
  const tbody=el('tbody','');tbl.appendChild(tbody);

  if(opts.totals){
    const tfoot=document.createElement('tfoot');
    tbl.appendChild(tfoot);
    wrap._tfoot=tfoot;
  }

  function render(){
    // update sort headers
    thead.querySelectorAll('th').forEach((th,i)=>{
      const ci=opts.rowSelect?i-1:i;
      if(ci<0)return;
      const c=cols[ci];
      th.className=sortKey===c.key?'srt':'';
      const arrow=sortKey===c.key?(sortDir==='asc'?' ▲':' ▼'):' ⇅';
      th.innerHTML=`${c.label||c.key}<span class="sort-arrow">${arrow}</span>`;
      th.addEventListener('click',()=>{
        if(sortKey===c.key)sortDir=sortDir==='asc'?'desc':'asc';
        else{sortKey=c.key;sortDir='asc';}
        render();
      });
    });

    const sorted=[...data].sort((a,b)=>{
      const av=a[sortKey],bv=b[sortKey];
      let n=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'en',{numeric:true});
      return sortDir==='asc'?n:-n;
    });
    tbody.innerHTML='';
    sorted.forEach(row=>{
      const tr=el('tr','');
      if(selected.has(row.id))tr.classList.add('sel');
      if(opts.rowSelect){
        const td=el('td','');
        const cb=el('input','');cb.type='checkbox';cb.checked=selected.has(row.id);
        cb.addEventListener('change',()=>{selected.has(row.id)?selected.delete(row.id):selected.add(row.id);render();opts.onSelect&&opts.onSelect(selected);});
        td.appendChild(cb);tr.appendChild(td);
      }
      cols.forEach(c=>{
        const td=el('td',c.num?'num':'');
        const val=row[c.key];
        if(c.badge){
          const tag=c.badge(val,row);
          td.innerHTML=`<span class="tag ${tag.cls}">${tag.text}</span>`;
        } else if(c.num){
          td.textContent=typeof val==='number'?fmt(val):(val||'—');
          if(opts.onEdit){td.classList.add('ed');td.addEventListener('dblclick',()=>startEdit(td,row,c,render));}
        } else {
          td.textContent=val||'—';
          if(c.key!=='Status'&&opts.onEdit){td.classList.add('ed');td.addEventListener('dblclick',()=>startEdit(td,row,c,render));}
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    // totals
    if(opts.totals&&wrap._tfoot){
      wrap._tfoot.innerHTML='';
      const tr=el('tr','');
      if(opts.rowSelect){const td=el('td','');tr.appendChild(td);}
      cols.forEach((c,i)=>{
        const td=el('td','');
        if(i===0){td.textContent='TOTALS';td.style.textAlign='left';}
        else if(c.num){
          const sum=data.reduce((s,r)=>s+(typeof r[c.key]==='number'?r[c.key]:0),0);
          td.textContent=fmt(sum);
        }
        tr.appendChild(td);
      });
      wrap._tfoot.appendChild(tr);
    }
  }

  render();
  wrap.appendChild(tbl);
  wrap._render=render;
  wrap._getSelected=()=>selected;
  wrap._clearSelected=()=>{selected.clear();render();};
  return wrap;
}

function startEdit(td,row,col,rerender){
  const orig=row[col.key];
  const inp=el('input','cedit');
  inp.value=orig||'';
  td.textContent='';td.appendChild(inp);inp.focus();
  const commit=()=>{
    const v=inp.value;
    row[col.key]=col.num?(parseFloat(v)||0):v;
    if(col.key==='Rate'||col.key==='Quantity')row['Mat. Value']=(row.Quantity||0)*(row.Rate||0);
    rerender();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape')rerender();});
}
